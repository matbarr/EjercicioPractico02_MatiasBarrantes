spring.application.name=MediCare

# Puerto para acceder a la aplicacion
server.port=78

# Formato de hora en el log de la consola
logging.pattern.dateformat=hh:mm

# Elimina el banner de Spring al arrancar
spring.main.banner-mode=off

# En desarrollo usar false; en produccion cambiar a true
spring.thymeleaf.cache=false

# Conexion local a la BD medicare en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/medicare
spring.datasource.username=${MEDICARE_DB_USERNAME:root}
spring.datasource.password=${MEDICARE_DB_PASSWORD:root}

# Driver y plataforma de comunicacion
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuracion JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# Mostrar informacion en el log (util para depuracion)
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Esta informacion se utiliza para obtener acceso a su storage (opcional)
firebase.bucket.name=tecshop-16165.firebasestorage.app
firebase.storage.path=techshop
firebase.json.path=firebase
firebase.json.file=tecshop-16165-firebase-adminsdk-fbsvc-ecd1f1a926

# Propiedades para enviar correos
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tu_correo@gmail.com
spring.mail.password=xxx_clave_de_16_digitos_sin_espacios_xxx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=tu_correo@gmail.com

# Nombre del servidor donde esta la aplicacion
servidor.http=localhost
