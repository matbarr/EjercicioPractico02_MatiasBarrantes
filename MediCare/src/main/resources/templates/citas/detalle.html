<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle Cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>
<div th:replace="~{fragments :: navbar}"></div>

<main class="container my-4">
    <h2>Detalle de Cita Medica</h2>
    <div class="card">
        <div class="card-body">
            <p><strong>ID:</strong> <span th:text="${cita.id}"></span></p>
            <p><strong>Paciente:</strong> <span th:text="${cita.pacienteNombre}"></span></p>
            <p><strong>Especialidad:</strong> <span th:text="${cita.especialidad}"></span></p>
            <p><strong>Fecha:</strong> <span th:text="${cita.fecha}"></span></p>
            <p><strong>Costo:</strong> <span th:text="${cita.costo}"></span></p>
            <p><strong>Estado:</strong> <span th:text="${cita.activa} ? 'Activa' : 'Inactiva'"></span></p>
        </div>
    </div>
    <a class="btn btn-secondary mt-3" th:href="@{/citas}">Volver</a>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
