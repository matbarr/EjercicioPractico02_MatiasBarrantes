<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario Cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>
<div th:replace="~{fragments :: navbar}"></div>

<main class="container my-4">
    <h2 th:text="${cita.id == null} ? 'Nueva Cita Medica' : 'Editar Cita Medica'"></h2>

    <form th:action="@{/citas/guardar}" th:object="${cita}" method="post" class="card card-body">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nombre del Paciente</label>
            <input class="form-control" th:field="*{pacienteNombre}">
            <div class="text-danger small" th:if="${#fields.hasErrors('pacienteNombre')}" th:errors="*{pacienteNombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Especialidad</label>
            <input class="form-control" th:field="*{especialidad}">
            <div class="text-danger small" th:if="${#fields.hasErrors('especialidad')}" th:errors="*{especialidad}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha de Cita</label>
            <input class="form-control" type="date" th:field="*{fecha}">
            <div class="text-danger small" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Costo</label>
            <input class="form-control" type="number" min="1" step="0.01" th:field="*{costo}">
            <div class="text-danger small" th:if="${#fields.hasErrors('costo')}" th:errors="*{costo}"></div>
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" th:field="*{activa}">
            <label class="form-check-label">Activa</label>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-success" type="submit">Guardar</button>
            <a class="btn btn-secondary" th:href="@{/citas}">Cancelar</a>
        </div>
    </form>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
