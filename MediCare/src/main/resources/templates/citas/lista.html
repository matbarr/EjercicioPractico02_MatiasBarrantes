<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Citas Medicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>
<div th:replace="~{fragments :: navbar}"></div>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="section-title">Gestion de Citas Medicas</h2>
        <a class="btn btn-primary" th:href="@{/citas/nueva}" sec:authorize="hasAnyRole('ADMIN','MEDICO')">Nueva Cita</a>
    </div>

    <div class="entity-grid" th:if="${!#lists.isEmpty(citas)}">
        <article class="entity-card" th:each="cita : ${citas}">
            <h5 th:text="${cita.pacienteNombre}"></h5>
            <p class="entity-meta"><strong>ID:</strong> <span th:text="${cita.id}"></span></p>
            <p class="entity-meta"><strong>Especialidad:</strong> <span th:text="${cita.especialidad}"></span></p>
            <p class="entity-meta"><strong>Fecha:</strong> <span th:text="${cita.fecha}"></span></p>
            <p class="entity-meta"><strong>Costo:</strong> ₡<span th:text="${cita.costo}"></span></p>
            <p class="entity-meta">
                <strong>Estado:</strong>
                <span class="badge ms-1" th:classappend="${cita.activa} ? 'text-bg-success' : 'text-bg-secondary'"
                      th:text="${cita.activa} ? 'Activa' : 'Inactiva'"></span>
            </p>
            <div class="entity-actions">
                <a class="btn btn-sm btn-info" th:href="@{'/citas/detalle/' + ${cita.id}}">Detalle</a>
                <a class="btn btn-sm btn-warning" sec:authorize="hasAnyRole('ADMIN','MEDICO')"
                   th:href="@{'/citas/editar/' + ${cita.id}}">Editar</a>
                <a class="btn btn-sm btn-danger" sec:authorize="hasAnyRole('ADMIN','MEDICO')"
                   th:href="@{'/citas/eliminar/' + ${cita.id}}" onclick="return confirm('Desea eliminar la cita?');">Eliminar</a>
            </div>
        </article>
    </div>

    <div class="alert alert-light border" th:if="${#lists.isEmpty(citas)}">
        No hay citas registradas.
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
