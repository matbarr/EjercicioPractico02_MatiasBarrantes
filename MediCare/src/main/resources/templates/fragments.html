<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="mc-header text-white py-3 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
        <h1 class="h4 mb-0 mc-brand-title">MediCare</h1>
        <small class="fw-semibold">Gestion de citas medicas y usuarios</small>
    </div>
</header>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark mc-nav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Inicio</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/usuarios}">Usuarios</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/roles}">Roles</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','MEDICO','PACIENTE')">
                    <a class="nav-link" th:href="@{/citas}">Citas Medicas</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','MEDICO')">
                    <a class="nav-link" th:href="@{/consultas}">Consultas Avanzadas</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="nav-link text-info" sec:authentication="name"></span>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="m-0 p-0">
                        <button type="submit" class="nav-link btn btn-link text-decoration-none">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="mc-footer py-3 mt-5">
    <div class="container text-center text-muted small">
        <span>MediCare - Caso Practico 2 - Universidad Fidelitas</span>
    </div>
</footer>
</body>
</html>
