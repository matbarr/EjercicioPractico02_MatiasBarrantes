<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MediCare | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <h1 class="h3 text-center mb-4">Iniciar Sesion</h1>

                    <div th:if="${param.error}" class="alert alert-danger">Credenciales invalidas.</div>
                    <div th:if="${param.logout}" class="alert alert-success">Sesion cerrada correctamente.</div>
                    <div th:if="${param.registroExitoso}" class="alert alert-success">Registro exitoso. Ya puedes iniciar sesion.</div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="username">Correo</label>
                            <input class="form-control" type="email" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Contrasena</label>
                            <input class="form-control" type="password" id="password" name="password" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Entrar</button>
                    </form>

                    <p class="small text-center mt-3 mb-0">
                        Nuevo en MediCare? <a th:href="@{/registro}">Registrate aqui</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
