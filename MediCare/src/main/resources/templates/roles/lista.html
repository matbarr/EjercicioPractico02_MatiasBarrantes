<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>
<div th:replace="~{fragments :: navbar}"></div>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="section-title">Gestion de Roles</h2>
        <a class="btn btn-primary" th:href="@{/roles/nuevo}">Nuevo Rol</a>
    </div>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div>

    <div class="entity-grid" th:if="${!#lists.isEmpty(roles)}">
        <article class="entity-card" th:each="rol : ${roles}">
            <h5 th:text="${rol.nombre}"></h5>
            <p class="entity-meta"><strong>ID:</strong> <span th:text="${rol.id}"></span></p>
            <div class="entity-actions">
                <a class="btn btn-sm btn-warning" th:href="@{'/roles/editar/' + ${rol.id}}">Editar</a>
                <form th:action="@{'/roles/eliminar/' + ${rol.id}}" method="post" class="m-0"
                      onsubmit="return confirm('Desea eliminar este rol?');">
                    <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                </form>
            </div>
        </article>
    </div>

    <div class="alert alert-light border" th:if="${#lists.isEmpty(roles)}">
        No hay roles registrados.
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
