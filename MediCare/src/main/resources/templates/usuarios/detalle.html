<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>
<div th:replace="~{fragments :: navbar}"></div>

<main class="container my-4">
    <h2>Detalle de Usuario</h2>
    <div class="card">
        <div class="card-body">
            <p><strong>ID:</strong> <span th:text="${usuario.id}"></span></p>
            <p><strong>Nombre:</strong> <span th:text="${usuario.nombre}"></span></p>
            <p><strong>Email:</strong> <span th:text="${usuario.email}"></span></p>
            <p><strong>Rol:</strong> <span th:text="${usuario.rol != null ? usuario.rol.nombre : 'Sin rol'}"></span></p>
            <p><strong>Activo:</strong> <span th:text="${usuario.activo} ? 'Si' : 'No'"></span></p>
            <p><strong>Fecha creacion:</strong> <span th:text="${usuario.fechaCreacion}"></span></p>
        </div>
    </div>
    <a class="btn btn-secondary mt-3" th:href="@{/usuarios}">Volver</a>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
