<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>
<div th:replace="~{fragments :: navbar}"></div>

<main class="container my-4">
    <h2 th:text="${usuario.id == null} ? 'Nuevo Usuario' : 'Editar Usuario'"></h2>

    <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" class="card card-body">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{fechaCreacion}">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input class="form-control" th:field="*{nombre}">
            <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input class="form-control" type="email" th:field="*{email}">
            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Contrasena</label>
            <input class="form-control" type="password" th:field="*{password}">
            <small class="text-muted" th:if="${usuario.id != null}">Deje vacio para conservar la contrasena actual.</small>
            <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Rol</label>
            <select class="form-select" th:field="*{rol.id}">
                <option value="">Seleccione</option>
                <option th:each="rol : ${roles}" th:value="${rol.id}" th:text="${rol.nombre}"></option>
            </select>
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" th:field="*{activo}">
            <label class="form-check-label">Activo</label>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-success" type="submit">Guardar</button>
            <a class="btn btn-secondary" th:href="@{/usuarios}">Cancelar</a>
        </div>
    </form>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
