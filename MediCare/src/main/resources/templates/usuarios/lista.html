<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>
<div th:replace="~{fragments :: navbar}"></div>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="section-title">Gestion de Usuarios</h2>
        <a class="btn btn-primary" th:href="@{/usuarios/nuevo}" sec:authorize="hasRole('ADMIN')">Nuevo Usuario</a>
    </div>

    <div class="entity-grid" th:if="${!#lists.isEmpty(usuarios)}">
        <article class="entity-card" th:each="usuario : ${usuarios}">
            <h5 th:text="${usuario.nombre}"></h5>
            <p class="entity-meta"><strong>ID:</strong> <span th:text="${usuario.id}"></span></p>
            <p class="entity-meta"><strong>Email:</strong> <span th:text="${usuario.email}"></span></p>
            <p class="entity-meta"><strong>Rol:</strong> <span th:text="${usuario.rol != null ? usuario.rol.nombre : 'Sin rol'}"></span></p>
            <p class="entity-meta">
                <strong>Estado:</strong>
                <span class="badge ms-1" th:classappend="${usuario.activo} ? 'text-bg-success' : 'text-bg-secondary'"
                      th:text="${usuario.activo} ? 'Activo' : 'Inactivo'"></span>
            </p>
            <div class="entity-actions">
                <a class="btn btn-sm btn-info" th:href="@{'/usuarios/detalle/' + ${usuario.id}}">Detalle</a>
                <a class="btn btn-sm btn-warning" th:href="@{'/usuarios/editar/' + ${usuario.id}}">Editar</a>
                <a class="btn btn-sm btn-danger" th:href="@{'/usuarios/eliminar/' + ${usuario.id}}"
                   onclick="return confirm('Desea eliminar este usuario?');">Eliminar</a>
            </div>
        </article>
    </div>

    <div class="alert alert-light border" th:if="${#lists.isEmpty(usuarios)}">
        No hay usuarios registrados.
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
